# Builds the installer on GitHub's Windows runners, from the source in this repository only,
# so anyone can see how GigaPisar-Setup.exe is made. Runs on every version tag and by hand.
# On a tag, the installer is attached to that version's draft release (tools/release.sh makes
# the draft, waits for this build, then writes update.json from the published file and
# publishes the release): what users download is exactly what this workflow built.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish the app
        run: dotnet publish src/GigaPisar.csproj -c Release -r win-x64 --self-contained true -o dist/app -nologo

      # onnxruntime.dll needs the Visual C++ runtime, which a clean Windows 10 lacks.
      # Microsoft allows shipping these files next to an application.
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" dist/app/
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\setup.iss'

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/GigaPisar-Setup.exe -Algorithm SHA256).Hash

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/GigaPisar-Setup.exe -R "${{ github.repository }}" --clobber
