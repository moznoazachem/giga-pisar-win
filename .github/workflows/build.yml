# Builds the installer on GitHub's Windows runners, from the source in this repository only,
# so anyone can see how GigaPisar-Setup.exe is made. Runs on every version tag and by hand.
# On a tag, the installer is attached to that version's draft release (tools/release.sh makes
# the draft, waits for this build, then writes update.json from the published file and
# publishes the release): what users download is exactly what this workflow built.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # Only the text tests for now: the capture tests fell behind Recorder.cs and fail on their own.
      - name: Run the text tests
        run: dotnet test tests/GigaPisar.Tests -nologo --filter "FullyQualifiedName~HesitationsTests|FullyQualifiedName~SpacingTests"

      - name: Publish the app
        run: dotnet publish src/GigaPisar.csproj -c Release -r win-x64 --self-contained true -o dist/app -nologo

      # The launcher must not carry the CET mark (see CETCompat in the csproj): with it the app
      # does not start on Windows 10 with a recent processor, and nothing in the logs says why.
      - name: Check the launcher
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("dist/app/GigaPisar.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sections = [BitConverter]::ToUInt16($b, $pe + 6)
          $opt = $pe + 24
          $table = $opt + [BitConverter]::ToUInt16($b, $pe + 20)
          $debugRva = [BitConverter]::ToUInt32($b, $opt + 112 + 6 * 8)
          $debugSize = [BitConverter]::ToUInt32($b, $opt + 112 + 6 * 8 + 4)
          $debugAt = -1
          for ($i = 0; $i -lt $sections; $i++) {
            $s = $table + $i * 40
            $va = [BitConverter]::ToUInt32($b, $s + 12)
            $raw = [BitConverter]::ToUInt32($b, $s + 16)
            if ($debugRva -ge $va -and $debugRva -lt $va + $raw) {
              $debugAt = $debugRva - $va + [BitConverter]::ToUInt32($b, $s + 20)
            }
          }
          $cet = $false
          if ($debugAt -ge 0) {
            for ($e = $debugAt; $e -lt $debugAt + $debugSize; $e += 28) {
              # IMAGE_DEBUG_TYPE_EX_DLLCHARACTERISTICS = 20, IMAGE_DLLCHARACTERISTICS_EX_CET_COMPAT = 1
              if ([BitConverter]::ToUInt32($b, $e + 12) -eq 20) {
                $flags = [BitConverter]::ToUInt32($b, [BitConverter]::ToUInt32($b, $e + 24))
                if ($flags -band 1) { $cet = $true }
              }
            }
          }
          "CET mark on the launcher: $cet"
          if ($cet) { throw "GigaPisar.exe is marked CET-compatible" }
          # And the runtime does start: a diagnostic mode that only writes a file and exits.
          $p = Start-Process dist/app/GigaPisar.exe -ArgumentList '--selection-test', "$env:RUNNER_TEMP\selection.txt" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "GigaPisar.exe did not exit" }
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -eq -2146233082) { throw "the .NET runtime failed to start (0x80131506)" }

      # onnxruntime.dll needs the Visual C++ runtime, which a clean Windows 10 lacks.
      # Microsoft allows shipping these files next to an application.
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" dist/app/
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\setup.iss'

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/GigaPisar-Setup.exe -Algorithm SHA256).Hash

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/GigaPisar-Setup.exe -R "${{ github.repository }}" --clobber
